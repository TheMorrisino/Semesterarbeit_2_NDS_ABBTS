name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "22"
  APP_DIR: Ressourcix-web-app/source/Fullstack-Ressourcix/app
  BACKEND_DIR: Ressourcix-web-app/source/Fullstack-Ressourcix
  TESTS_DIR: Ressourcix-web-app/source/Fullstack-Ressourcix.Tests

jobs:
  backend:
    name: Backend (.NET) – Build & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_DB: ressourcix
          POSTGRES_USER: ressourcix
          POSTGRES_PASSWORD: ressourcix_dev_pw
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - name: .NET SDK einrichten
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Node wird hier nur zur Sicherheit mitinstalliert, falls `dotnet build`
      # über die <SpaRoot>-Integration im Hauptprojekt einen npm-Schritt anstösst.
      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore
        run: dotnet restore "${{ env.TESTS_DIR }}/Fullstack-Ressourcix.Tests.csproj"

      - name: Build
        run: dotnet build "${{ env.TESTS_DIR }}/Fullstack-Ressourcix.Tests.csproj" --no-restore --configuration Release

      - name: Test
        run: >
          dotnet test "${{ env.TESTS_DIR }}/Fullstack-Ressourcix.Tests.csproj"
          --no-build --configuration Release
          --logger "trx;LogFileName=test-results.trx"
          --results-directory "${{ env.TESTS_DIR }}/TestResults"

      - name: Testergebnisse hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: ${{ env.TESTS_DIR }}/TestResults/**/*.trx

  frontend:
    name: Frontend (Vue) – Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json

      - name: Abhängigkeiten installieren
        working-directory: ${{ env.APP_DIR }}
        run: npm ci

      - name: Lint
        working-directory: ${{ env.APP_DIR }}
        run: npm run lint

      - name: Unit-Tests (Vitest)
        working-directory: ${{ env.APP_DIR }}
        run: npm run test

      - name: Build (Type-Check + Vite Production Build)
        working-directory: ${{ env.APP_DIR }}
        run: npm run build

  publish:
    name: Produktions-Build (dotnet publish)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: .NET SDK einrichten
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json

      # Entspricht 1:1 dem in README.md dokumentierten Produktions-Build-Befehl:
      # baut Backend + Frontend (via <SpaRoot>: npm install + npm run build) in einem Schritt.
      - name: dotnet publish
        working-directory: ${{ env.BACKEND_DIR }}
        run: dotnet publish -c Release -o "${{ github.workspace }}/publish-output"

      - name: Build-Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: ressourcix-release-build
          path: publish-output
          retention-days: 14
